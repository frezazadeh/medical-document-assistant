[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-document-assistant"
version = "0.1.0"
description = "Local prototype: question answering over clinical documents with citations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "pypdf>=5.0",
    "chromadb>=1.0",
    "fastembed>=0.5",
    "langgraph>=1.0",
    "mcp>=2.0",
    "anthropic>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "fpdf2>=2.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"scripts/make_sample_docs.py" = ["E501"]  # long lines are document text
